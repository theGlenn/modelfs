name: Release

# Pushing a tag like v0.1.0 publishes a GitHub release with a universal macOS
# binary, then points the Homebrew formula at it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      archive: ${{ steps.package.outputs.archive }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Check the tag matches the crate version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "modeld-cli") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match modeld-cli version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test
        run: cargo test --workspace --locked
      - name: Build a universal binary
        run: |
          cargo build --release --locked -p modeld-cli --target aarch64-apple-darwin
          cargo build --release --locked -p modeld-cli --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/modeld \
            target/aarch64-apple-darwin/release/modeld \
            target/x86_64-apple-darwin/release/modeld
          lipo -info dist/modeld
          dist/modeld --version
      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="modelfs-$VERSION-macos-universal"
          mkdir "$name"
          cp dist/modeld README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d ' ' -f 1 "$name.tar.gz.sha256")" >> "$GITHUB_OUTPUT"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
            --verify-tag --generate-notes --title "ModelFS $VERSION"

  homebrew:
    name: Update the Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Point Formula/modelfs.rb at the new release
        env:
          # Fine-grained token with contents:write on theGlenn/homebrew-tap only.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.release.outputs.version }}
          ARCHIVE: ${{ needs.release.outputs.archive }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; update Formula/modelfs.rb in theGlenn/homebrew-tap by hand"
            exit 0
          fi
          url="https://github.com/theGlenn/modelfs/releases/download/$TAG/$ARCHIVE"
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/theGlenn/homebrew-tap.git" tap
          cd tap
          sed -i -E \
            -e "s|^  url \".*\"$|  url \"$url\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"$SHA256\"|" \
            Formula/modelfs.rb
          if git diff --quiet; then
            echo "Formula already points at $TAG"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "modelfs $VERSION"
          git push
