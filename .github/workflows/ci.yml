name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, test
    # Tests exercise clonefile, renamex_np, and F_LOG2PHYS_EXT: macOS on APFS only.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  app:
    name: app (build, test, bundle)
    # Package.swift needs Swift 6.2 (Xcode 26), and the app macOS 15 or later.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - run: cargo build --locked -p modeld-cli
      - run: swift build --package-path app
      - name: swift test (end to end against the engine just built)
        run: swift test --package-path app
        env:
          MODELD_BIN: ${{ github.workspace }}/target/debug/modeld
      - run: scripts/build-app.sh

  test-intel:
    name: test (Intel)
    # Releases ship a universal binary; this tests the x86_64 half natively.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update
      - run: cargo test --workspace --locked
